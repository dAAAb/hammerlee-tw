<title>跟川伯聊天</title>
<meta name="description" content="一頁滑到底的 3D LINE 對話：新北市長候選人李四川（川伯）跟你話家常、聊新北的下一段路。">
<style>
:root {
  --floor: #a9c6ea;
  --ink: #231e16;
  --paper: #fffdf6;
  --navy: #00449a;
  --blue: #0096e8;
  --yellow: #ffc105;
  --teal: #2ac9c9;
  --line-green: #06c755;
  --ui-font: "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
}
html, body { background: var(--floor); color: var(--ink); }
body { margin: 0; font-family: var(--ui-font); overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; width: 100vw; height: 100%; display: block; touch-action: pan-y; }
#scroller { position: relative; width: 1px; pointer-events: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#hits { position: fixed; inset: 0; pointer-events: none; }
#hits button, #hits a { position: absolute; pointer-events: auto; background: transparent; border: 0; padding: 0; margin: 0; cursor: pointer; border-radius: 16px; color: transparent; font-size: 1px; }
#hits button:focus-visible, #hits a:focus-visible { outline: 4px solid var(--yellow); outline-offset: 2px; }
#boot { position: fixed; inset: 0; display: grid; place-items: center; font: 600 22px/1.5 var(--ui-font); color: var(--navy); background: var(--floor); transition: opacity .6s; z-index: 5; }
#boot.gone { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { #boot { transition: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<canvas id="stage" aria-hidden="true"></canvas>
<div id="scroller"></div>
<div id="textlayer" role="log" aria-label="跟川伯的對話"></div>
<div id="hits"></div>
<div id="log" class="sr" aria-live="polite"></div>
<div id="boot">川伯準備中…</div>
