<!doctype html><meta charset="utf-8"><title>多支手機一起玩：測試</title>
<!-- 2–4 "phones" side by side on one screen, for 多支手機一起玩 (實驗功能). Copy next to the build and open it:
       cp tools/pair-twins.html dist/ && npm run serve   ->  http://localhost:5173/pair-twins.html?phones=3
     Other query flags pass through to every phone: ?realtime (go through Supabase Realtime), ?lag=150 (slow local link). -->
<style>
html, body { margin: 0; height: 100%; background: #2b2b2b; }
body { display: flex; gap: 18px; justify-content: center; align-items: center; }
iframe { width: 340px; height: 680px; max-height: 96vh; border: 0; border-radius: 18px; background: #a9c6ea; flex: none; }
</style>
<body>
<script>
const q = new URLSearchParams(location.search), n = Math.min(4, Math.max(2, +q.get('phones') || 2));
q.delete('phones');
for (let i = 0; i < n; i++) {
  const f = document.createElement('iframe');
  f.title = '手機 ' + 'ABCD'[i];
  f.src = 'index.html?nointro&debug' + (q.size ? '&' + q : '');
  document.body.append(f);
}
</script>
